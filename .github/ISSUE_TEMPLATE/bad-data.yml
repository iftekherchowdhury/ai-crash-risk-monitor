name: Bad data
description: Report a wrong, stale or missing value
labels: [data]
body:
  - type: input
    id: id
    attributes: {label: Indicator id, placeholder: "e.g. hy"}
    validations: {required: true}
  - type: input
    id: date
    attributes: {label: Reading date}
    validations: {required: true}
  - type: input
    id: correct
    attributes: {label: Correct value and observation date}
  - type: input
    id: source
    attributes: {label: Source URL for the correct value}
    validations: {required: true}
  - type: textarea
    id: details
    attributes: {label: Details}
