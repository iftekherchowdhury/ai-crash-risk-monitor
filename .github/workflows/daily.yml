name: Daily update and deploy

on:
  schedule:
    - cron: "45 21 * * 1-5"   # weekdays 21:45 UTC, after the US close
  workflow_dispatch:
    inputs:
      date:
        description: "Close date to compute (YYYY-MM-DD). Blank = today in New York."
        required: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Pick date
        id: d
        run: echo "date=${{ inputs.date || '' }}" >> "$GITHUB_OUTPUT"
      - name: Fetch FRED indicators (others carried forward, marked stale when old)
        if: github.event_name != 'push'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional
        run: |
          D="${{ steps.d.outputs.date }}"; [ -n "$D" ] || D=$(TZ=America/New_York date +%F)
          echo "D=$D" >> "$GITHUB_ENV"
          python3 scripts/fetch_fred.py "$D"
      - name: Fetch backtest history
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 scripts/fetch_hist.py
      - name: Compute
        if: github.event_name != 'push'
        run: |
          if [ -f hist/NFCI.csv ]; then python3 compute.py "$D" --backtest; else echo "::warning::history fetch failed; backtest not refreshed"; python3 compute.py "$D"; fi
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "crash-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || (git commit -m "data: daily update $D" && git push)
      - name: Build site
        run: sh scripts/build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
